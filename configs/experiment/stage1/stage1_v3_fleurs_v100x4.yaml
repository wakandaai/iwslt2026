# Stage 1 v3: continues from Stage 1 v2's encoder_step50000.pt for 50k more
# steps (100k total), on the FLEURS-augmented index (ASR_INDEX_V5_16k.csv)
# instead of V4 -- see .envs/scripts/build_fleurs_augment.py. Runs on 4x
# V100-32 DDP. Must run under .envs/omniasr_extract (torch==2.8.0+cu128) via
# torchrun --standalone --nproc_per_node=4.

encoder:
  type: omniasr_live
  checkpoint: checkpoints/omniasr_ctc_1b/omniASR-CTC-1B.pt
  dropout_p: 0.1
  attn_dropout_p: 0.1
  ffn_inner_dropout_p: 0.1
  layer_drop_p: 0.0
  final_dropout_p: 0.1
  freeze_ctc_head: false
  gradient_checkpointing_every_n: 1   # needed to avoid OOM at world_size=4 on V100-32

data:
  train_index:      /ocean/projects/cis250145p/shared/ASR_INDEX_V5_16k.csv
  val_index:        /ocean/projects/cis250145p/shared/ASR_INDEX_V5_16k.csv
  train_split:       train
  val_split:         dev
  sp_tokenizer_path: checkpoints/omniasr_ctc_1b/omniASR_tokenizer.model
  languages:          null   # null = all 22 languages in the index
  max_duration:       20.0
  min_duration:       0.5
  max_target_tokens:  400
  lowercase:          true

training:
  output_dir: runs/stage1_v3_fleurs

  max_steps: 100000
  lr: 1.0e-5
  min_lr: 1.0e-7
  warmup_steps: 500
  first_cycle_steps: 25000
  cycle_mult: 1.0
  gamma: 1.0
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 2

  max_batch_duration: 10.0
  max_batch_size: 2
  num_workers: 4

  sampling:
    strategy: weighted_language
    beta_language: 0.7
    num_batches: 900000   # max_steps(100000) * grad_accum(2) * world_size(4) + buffer
    seed: 42

  log_every: 20
  save_every: 2500
  eval_every: 2500
  val_samples_per_lang: 30
  val_batch_size: 2

  no_wandb: false
  wandb_project: aura-mt
  wandb_entity: etanghan-carnegie-mellon-university
  wandb_run_name: stage1_v3_fleurs
