# Smoke test for stage1_v3_fleurs_v100x4.yaml before committing to the real
# 48h/4-GPU run: first time --resume_from encoder_step50000.pt is combined
# with 4-GPU DDP + the NEW ASR_INDEX_V5_16k.csv (FLEURS rows added). Only
# runs 10 steps past the resume point to confirm no crash (bad row in the
# new V5 data, DDP init at world_size=4, sampler/scheduler resume) before
# committing GPU-days to it.

encoder:
  type: omniasr_live
  checkpoint: checkpoints/omniasr_ctc_1b/omniASR-CTC-1B.pt
  dropout_p: 0.1
  attn_dropout_p: 0.1
  ffn_inner_dropout_p: 0.1
  layer_drop_p: 0.0
  final_dropout_p: 0.1
  freeze_ctc_head: false

data:
  train_index:      /ocean/projects/cis250145p/shared/ASR_INDEX_V5_16k.csv
  val_index:        /ocean/projects/cis250145p/shared/ASR_INDEX_V5_16k.csv
  train_split:       train
  val_split:         dev
  sp_tokenizer_path: checkpoints/omniasr_ctc_1b/omniASR_tokenizer.model
  languages:          null
  max_duration:       20.0
  min_duration:       0.5
  max_target_tokens:  400
  lowercase:          true

training:
  output_dir: runs/stage1_v3_fleurs_smoke

  max_steps: 50010   # resume from 50000, run 10 more steps
  lr: 1.0e-5
  min_lr: 1.0e-7
  warmup_steps: 500
  first_cycle_steps: 25000
  cycle_mult: 1.0
  gamma: 1.0
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 8

  max_batch_duration: 10.0
  max_batch_size: 2
  num_workers: 4

  sampling:
    strategy: weighted_language
    beta_language: 0.7
    num_batches: 2000
    seed: 42

  log_every: 1
  save_every: 5
  eval_every: 5
  val_samples_per_lang: 3
  val_batch_size: 2

  no_wandb: true
