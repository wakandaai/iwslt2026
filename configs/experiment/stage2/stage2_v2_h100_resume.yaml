# Stage 2 v2: interactive (interact/salloc) session variant. Works on any GPU
# count — torchrun --nproc_per_node=N, or plain python for 1. Same
# model/data/aux_ctc_weight as stage2_v2.yaml. Separate output_dir/
# wandb_run_name so this doesn't collide with the batch H100x2 attempt
# (runs/stage2_v2_h100) or the 4x V100 one (runs/stage2_v2).
# Must run under .envs/omniasr_extract (torch==2.8.0+cu128), not Aura_base/env.

encoder:
  type: omniasr_live
  checkpoint: /ocean/projects/cis250145p/tanghang/iwslt2026/runs/stage1_v3_fleurs/encoder_step100000.pt
  dropout_p: 0.1
  attn_dropout_p: 0.1
  ffn_inner_dropout_p: 0.1
  layer_drop_p: 0.0
  final_dropout_p: 0.1
  freeze_ctc_head: true   # moot — encoder is frozen below anyway

aura:
  checkpoint: /ocean/projects/cis250145p/shared/checkpoints/Aura-1B/model.pt
  tokenizer:  /ocean/projects/cis250145p/shared/checkpoints/Aura-1B/tokenizer.json
  size: 1b

projector:
  type: transformer
  num_layers: 2
  num_heads: 8
  dropout: 0.1

ctc_compress:
  enabled: true
  strategy: avg        # only strategy that needs no gradient through ctc_logits
  remove_blanks: true
  blank_id: 0

data:
  train_index: /ocean/projects/cis250145p/shared/ASR_INDEX_V5_16k.csv
  val_index:   /ocean/projects/cis250145p/shared/ASR_INDEX_V5_16k.csv
  train_split: train
  val_split:   dev
  languages:   null   # null = all 22 languages in the index, matching Stage 1's scope
  max_duration: 20.0
  lowercase: true
  sp_tokenizer_path: /ocean/projects/cis250145p/tanghang/iwslt2026/checkpoints/omniasr_ctc_1b/omniASR_tokenizer.model

training:
  task: transcribe
  output_dir: runs/stage2_v2_h100_resume
  val_samples_per_lang: 30

  unfreeze_encoder: false   # frozen — this IS the "Stage 2" semantic (only projector trains)
  unfreeze_llm: false
  lora_rank: 0

  ctc_weight: 0.0           # required by build_model()'s omniasr_live guard
  aux_ctc_weight: 0.3       # see stage2_v2.yaml for the literature + ablation justification

  max_steps: 50000
  lr: 5.0e-5
  min_lr: 1.0e-6
  warmup_steps: 2000
  first_cycle_steps: 50000
  gamma: 0.5
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 4

  max_batch_duration: 20.0
  max_batch_size: 4
  max_seq_len: 1024
  num_workers: 4

  log_every: 20
  save_every: 1000   # short interval — an interactive allocation dying takes every unsaved step with it
  eval_every: 2500
  val_max_batches: 50

  no_wandb: false
  wandb_project: aura-mt
  wandb_entity: etanghan-carnegie-mellon-university
  wandb_run_name: stage2_v2_h100_resume
