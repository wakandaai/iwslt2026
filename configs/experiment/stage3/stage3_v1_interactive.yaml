# Stage 3 v1: projector + LoRA fine-tuning, seeded from Stage 2 v2's best
# checkpoint by WER (checkpoint_step40000). Encoder/aura/projector/data
# blocks copied verbatim from stage2/stage2_v2_interactive.yaml so the
# projector's state_dict loads strict=True with no shape mismatch.
#
# Launch (fresh start, seeded from Stage 2 — NOT a same-stage resume):
#   .envs/omniasr_extract/bin/torchrun --standalone --nproc_per_node=2 \
#       -m st.training.train_st \
#       --config configs/experiment/stage3/stage3_v1_interactive.yaml \
#       --resume_from runs/stage2_v2_interactive/checkpoint_step40000
#
# --resume_from loads weights only here — LoRA adds param groups Stage 2
# never had, so the optimizer.pt load fails and step resets to 0 (fresh
# warmup). To resume Stage 3 itself after a disconnect, --resume_from a
# stage3 checkpoint_step dir instead (optimizer.pt will match, step continues).

encoder:
  type: omniasr_live
  checkpoint: /ocean/projects/cis250145p/tanghang/iwslt2026/runs/stage1_v3_fleurs/encoder_step100000.pt
  dropout_p: 0.1
  attn_dropout_p: 0.1
  ffn_inner_dropout_p: 0.1
  layer_drop_p: 0.0
  final_dropout_p: 0.1
  freeze_ctc_head: true   # moot — encoder is frozen below anyway

aura:
  checkpoint: /ocean/projects/cis250145p/shared/checkpoints/Aura-1B/model.pt
  tokenizer:  /ocean/projects/cis250145p/shared/checkpoints/Aura-1B/tokenizer.json
  size: 1b

projector:
  type: transformer
  num_layers: 2
  num_heads: 8
  dropout: 0.1

ctc_compress:
  enabled: true
  strategy: avg
  remove_blanks: true
  blank_id: 0

data:
  train_index: /ocean/projects/cis250145p/shared/ASR_INDEX_V5_16k.csv
  val_index:   /ocean/projects/cis250145p/shared/ASR_INDEX_V5_16k.csv
  train_split: train
  val_split:   dev
  languages:   null   # null = all 22 languages, matching Stage 1/2's scope
  max_duration: 20.0
  lowercase: true
  sp_tokenizer_path: /ocean/projects/cis250145p/tanghang/iwslt2026/checkpoints/omniasr_ctc_1b/omniASR_tokenizer.model

training:
  task: transcribe
  output_dir: runs/stage3_v1_interactive
  val_samples_per_lang: 30

  unfreeze_encoder: false   # frozen — same as Stage 2
  unfreeze_llm: false       # LLM base frozen; only LoRA adapters train
  lora_rank: 32
  lora_alpha: 64
  lora_targets: [q_proj, v_proj]

  ctc_weight: 0.0           # required by build_model()'s omniasr_live guard
  aux_ctc_weight: 0.3       # same regularization role as Stage 2

  max_steps: 20000
  lr: 5.0e-5
  min_lr: 1.0e-6
  warmup_steps: 1000
  first_cycle_steps: 20000
  gamma: 0.5
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 4             # same wall-time reasoning as stage2_v2_interactive

  # raised from 20.0/4 on 2026-07-29 — first launch measured only 47-53% GPU
  # util, leaving most of the GPU idle at the old batch size.
  max_batch_duration: 60.0
  max_batch_size: 16
  max_seq_len: 1024
  num_workers: 4

  log_every: 20
  save_every: 1000   # same disconnect-safety reasoning as stage2_v2_interactive
  eval_every: 2500
  val_max_batches: 50

  no_wandb: false
  wandb_project: aura-mt
  wandb_entity: etanghan-carnegie-mellon-university
  wandb_run_name: stage3_v1_interactive
