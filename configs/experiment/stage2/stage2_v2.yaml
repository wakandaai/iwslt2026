# Stage 2 v2: frozen encoder computed live (no feature cache — full 22-lang
# cache would need ~4TB vs ~4.4TB free). Projector-only training; encoder +
# LLM both frozen. checkpoint = Stage 1 v2 output (encoder_step50000.pt,
# val/wer=0.2988 — the fixed/clean pipeline, better than v1's 0.3265).
# Fresh run, not a --resume_from of stage2_v1's checkpoint_step9000 — that
# projector was trained against v1's encoder feature space specifically and
# doesn't transfer to a different frozen encoder.
#
# Must run under .envs/omniasr_extract (torch==2.8.0+cu128), not Aura_base/env.
# Batch settings below are UNVALIDATED (reasoned, not smoke-tested) — see
# docs/stage1_omniasr_ctc_guide.md for the reasoning and full context.

encoder:
  type: omniasr_live
  checkpoint: /ocean/projects/cis250145p/tanghang/iwslt2026/runs/stage1_v2_ddp2/encoder_step50000.pt
  dropout_p: 0.1
  attn_dropout_p: 0.1
  ffn_inner_dropout_p: 0.1
  layer_drop_p: 0.0
  final_dropout_p: 0.1
  freeze_ctc_head: true   # moot — encoder is frozen below anyway

aura:
  checkpoint: /ocean/projects/cis250145p/shared/checkpoints/Aura-1B/model.pt
  tokenizer:  /ocean/projects/cis250145p/shared/checkpoints/Aura-1B/tokenizer.json
  size: 1b

projector:
  type: transformer
  num_layers: 2
  num_heads: 8
  dropout: 0.1

ctc_compress:
  enabled: true
  strategy: avg        # only strategy that needs no gradient through ctc_logits
  remove_blanks: true
  blank_id: 0

data:
  train_index: /ocean/projects/cis250145p/shared/ASR_INDEX_V4_16k.csv
  val_index:   /ocean/projects/cis250145p/shared/ASR_INDEX_V4_16k.csv
  train_split: train
  val_split:   dev
  languages:   null   # null = all 22 languages in the index, matching Stage 1's scope
  max_duration: 20.0
  lowercase: true

training:
  task: transcribe
  output_dir: runs/stage2_v2
  val_samples_per_lang: 30

  unfreeze_encoder: false   # frozen — this IS the "Stage 2" semantic (only projector trains)
  unfreeze_llm: false
  lora_rank: 0

  ctc_weight: 0.0           # required by build_model()'s omniasr_live guard

  max_steps: 50000
  lr: 5.0e-5   # matches stage2.yaml / cached-smoke precedent
  min_lr: 1.0e-6
  warmup_steps: 2000
  first_cycle_steps: 50000
  gamma: 0.5
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 8   # halved for 2x DDP: world_size(2) * grad_accum(8) = same effective batch as 1-GPU grad_accum(16)

  max_batch_duration: 20.0
  max_batch_size: 4
  max_seq_len: 1024
  num_workers: 4

  log_every: 20
  save_every: 2500
  eval_every: 2500
  val_max_batches: 50   # dev split is 120k+ examples — full pass through the LLM is too slow to run every eval

  no_wandb: false
  wandb_project: aura-mt
  wandb_entity: etanghan-carnegie-mellon-university
  wandb_run_name: stage2_v2
