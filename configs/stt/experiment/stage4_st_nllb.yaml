# Stage 4 (NLLB): warm-started from stage 3, whole of NLLB unfrozen.
#
# Stage 3 (runs/stage3_nllb_st_v2) trained the projector + text encoder + decoder
# cross-attention. Here every NLLB parameter — text encoder, full decoder, and the
# tied embedding — gets gradients, so the model can fine-tune end-to-end as a single
# speech-translation system.
#
# Safe to do now, unsafe earlier: the projector and encoder demonstrably carry content,
# so the decoder no longer has an easy path to cutting loss by ignoring the audio and
# behaving as an unconditional LM.
#
# Targets (dev, mean over 21 directions): cascade 12.66 BLEU, gold-transcript topline
# 22.14 — see runs/cascade/RESULTS.md.

encoder:
  input_dim: 80
  encoder_dim: 1024
  num_heads: 16
  ffn_dim: 4096
  num_layers: 18
  depthwise_conv_kernel_size: 31
  dropout: 0.1
  checkpoint: runs/stage1_20_lang/encoder_step72000.pt
  vocab_size: 828

nllb:
  model: /ocean/projects/cis250145p/shared/checkpoints/nllb-200-distilled-600M
  attach: encoder_input
  # Whole NLLB: text encoder + full decoder + the tied embedding. End-to-end fine-tune.
  trainable: all

projector:
  type: transformer
  num_layers: 2
  num_heads: 8
  dropout: 0.1

ctc_compress:
  enabled: true
  strategy: avg
  remove_blanks: true
  blank_id: 0

data:
  train_index: /ocean/projects/cis250145p/shared/datasets/AST_INDEX.csv
  val_index:   /ocean/projects/cis250145p/shared/datasets/AST_INDEX.csv
  train_split: train
  val_split:   dev
  languages:
    - amharic
    - arabic
    - bemba
    - english
    - french
    - hausa
    - igbo
    - kinyarwanda
    - lingala
    - luganda
    - malagasy
    - portuguese
    - shona
    - sotho
    - swahili
    - tigrinya
    - tswana
    - xhosa
    - yoruba
    - zulu
  max_duration: 30.0
  lowercase: false
  vocab_path: /ocean/projects/cis250145p/shared/checkpoints/conformer_encoder/vocab.json

training:
  task: st
  output_dir: runs/stage4_nllb_st_v2
  val_samples_per_lang: 25

  # Restores the projector *and* stage 3's trained text encoder + cross-attention.
  init_from: runs/stage3_nllb_st_v2/checkpoint_step25000

  unfreeze_encoder: false
  ctc_weight: 0.0
  # Alignment loss OFF: the text encoder trains here, so it can no longer serve as a
  # fixed alignment target. CE fine-tunes the whole system end-to-end.
  align_weight: 0.0

  # 256k-vocab softmax plus a full-decoder backward. Costs ~30% throughput.
  gradient_checkpointing: true

  max_steps: 30000
  # The projector is warm now rather than from-scratch, so its LR comes down too.
  lr: 5.0e-5
  # Halved from stage 3: 3x more pretrained params take gradients.
  pretrained_lr: 1.0e-5
  min_lr: 1.0e-6
  warmup_steps: 1000
  first_cycle_steps: 30000
  gamma: 0.8
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 1

  max_batch_duration: 300.0
  max_batch_size: 96
  max_target_tokens: 256
  num_workers: 10

  log_every: 50
  save_every: 2500
  eval_every: 2500

  no_wandb: false
  wandb_project: speech_aura
  wandb_run_name: nllb-full-st
