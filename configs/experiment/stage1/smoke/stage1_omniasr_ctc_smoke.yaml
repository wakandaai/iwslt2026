# Smoke test for stage1_omniasr_ctc_22lang.yaml — full pipeline end to end
# at tiny step count before committing a full GPU allocation.

encoder:
  type: omniasr_live
  checkpoint: /ocean/projects/cis250145p/tanghang/iwslt2026/checkpoints/omniasr_ctc_1b/omniASR-CTC-1B.pt
  dropout_p: 0.1
  attn_dropout_p: 0.1
  ffn_inner_dropout_p: 0.1
  layer_drop_p: 0.0
  final_dropout_p: 0.1
  freeze_ctc_head: false

data:
  train_index:      /ocean/projects/cis250145p/shared/ASR_INDEX_V4_16k.csv
  val_index:        /ocean/projects/cis250145p/shared/ASR_INDEX_V4_16k.csv
  train_split:       train
  val_split:         dev
  sp_tokenizer_path: /ocean/projects/cis250145p/tanghang/iwslt2026/checkpoints/omniasr_ctc_1b/omniASR_tokenizer.model
  languages:          null   # all 22 languages — exercise the full index on purpose
  max_duration:       20.0
  min_duration:       0.5
  max_target_tokens:  400
  lowercase:          true

training:
  output_dir: runs/stage1_omniasr_ctc_smoke

  max_steps: 20
  lr: 1.0e-5
  min_lr: 1.0e-7
  warmup_steps: 5
  first_cycle_steps: 20
  gamma: 0.5
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 4

  max_batch_duration: 40.0
  max_batch_size: 4
  num_workers: 4

  log_every: 1
  save_every: 10
  eval_every: 10
  val_samples_per_lang: 3
  val_batch_size: 4

  no_wandb: true
