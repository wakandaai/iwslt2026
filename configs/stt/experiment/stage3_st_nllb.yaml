# Stage 3 (NLLB): warm-started projector + trainable text encoder + decoder cross-attn.
#
# Stage 2 (runs/stage2_nllb_st, 6000 steps, everything but the projector frozen)
# reached BLEU 3.24 / chrF 25.08. Its outputs were fluent and in the right language but
# not yet grounded in the audio — the bridge works, it is just undertrained.
#
# In `attach: encoder_input`, the projected audio is fed as inputs_embeds INTO NLLB's
# text encoder, whose output drives the decoder's cross-attention. So the text encoder is
# the component that has to make sense of the audio — here it is unfrozen together with the
# decoder's cross-attention (its interface to the encoder). The decoder's self-attn/FFN
# stay frozen so the LM core cannot collapse into an unconditional LM at this step; the
# tied embedding stays frozen too. Stage 4 then unfreezes the whole of NLLB.
#
# Targets (dev, mean over 21 directions): cascade 12.66 BLEU, gold-transcript topline
# 22.14 — see runs/cascade/RESULTS.md.

encoder:
  input_dim: 80
  encoder_dim: 1024
  num_heads: 16
  ffn_dim: 4096
  num_layers: 18
  depthwise_conv_kernel_size: 31
  dropout: 0.1
  checkpoint: runs/stage1_20_lang/encoder_step72000.pt
  vocab_size: 828

nllb:
  model: /ocean/projects/cis250145p/shared/checkpoints/nllb-200-distilled-600M
  attach: encoder_input
  # Text encoder + decoder cross-attention (+ their layernorms). ~201M params.
  trainable: encoder_cross_attn

projector:
  type: transformer
  num_layers: 2
  num_heads: 8
  dropout: 0.1

ctc_compress:
  enabled: true
  strategy: avg
  remove_blanks: true
  blank_id: 0

data:
  train_index: /ocean/projects/cis250145p/shared/datasets/AST_INDEX.csv
  val_index:   /ocean/projects/cis250145p/shared/datasets/AST_INDEX.csv
  train_split: train
  val_split:   dev
  languages:
    - amharic
    - arabic
    - bemba
    - english
    - french
    - hausa
    - igbo
    - kinyarwanda
    - lingala
    - luganda
    - malagasy
    - portuguese
    - shona
    - sotho
    - swahili
    - tigrinya
    - tswana
    - xhosa
    - yoruba
    - zulu
  max_duration: 30.0
  lowercase: false
  vocab_path: /ocean/projects/cis250145p/shared/checkpoints/conformer_encoder/vocab.json

training:
  task: st
  output_dir: runs/stage3_nllb_st_v2
  val_samples_per_lang: 25

  # Warm-start the projector from stage 2 (loads projector.pt; there is no
  # nllb_trainable.pt at stage 2, which load_checkpoint tolerates).
  init_from: runs/stage2_nllb_st/checkpoint_step6000

  unfreeze_encoder: false
  ctc_weight: 0.0
  # Alignment loss OFF: it pulls the audio path toward the text encoder's output as a
  # FIXED target, but that encoder now trains — the target would move. CE drives it now.
  align_weight: 0.0

  # Encoder now retains activations for backward, so trade throughput for memory.
  gradient_checkpointing: true

  max_steps: 25000
  # Projector keeps the stage-2 LR; the pretrained NLLB (encoder + cross-attn) gets a
  # much lower one — 1e-4 would erase pretrained weights before they adapt.
  lr: 1.0e-4
  pretrained_lr: 2.0e-5
  min_lr: 1.0e-6
  warmup_steps: 1000
  first_cycle_steps: 25000
  gamma: 0.8
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 1

  max_batch_duration: 300.0
  max_batch_size: 96
  max_target_tokens: 256
  num_workers: 10

  log_every: 50
  save_every: 2500
  eval_every: 2500

  no_wandb: false
  wandb_project: speech_aura
  wandb_run_name: nllb-enc-crossattn-st
