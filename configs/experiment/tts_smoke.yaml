# TTS smoke test — tiny run to validate the pipeline end-to-end (data join,
# model build, train step, loss sanity, checkpoint). NOT a real training run.

aura:
  checkpoint: /ocean/projects/cis250145p/shared/checkpoints/Aura-1B/model.pt
  tokenizer:  /ocean/projects/cis250145p/shared/checkpoints/Aura-1B/tokenizer.json
  size: 1b

tts:
  n_codebooks: 12
  cardinality: 1024
  depth_dim: 1024
  depth_layers: 6
  depth_heads: 8
  depth_dropout: 0.0

data:
  train_index: /ocean/projects/cis250145p/shared/ASR_INDEX_V3_16k.csv
  # val disabled for the smoke (full dev-split loss pass would dominate runtime).
  dac_cache:   tts_cache/dac
  spk_cache:   tts_cache/spk
  train_split: train
  languages:
    - swahili
  min_frames: 8
  max_frames: 1500
  lowercase: true

training:
  output_dir: runs/tts_smoke
  seed: 42

  unfreeze_llm: false
  lora_rank: 0
  gradient_checkpointing: false

  max_steps: 60
  lr: 3.0e-4
  min_lr: 1.0e-6
  warmup_steps: 10
  first_cycle_steps: 60
  gamma: 1.0
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 1

  max_batch_frames: 3000
  max_batch_size: 8
  max_text_tokens: 256
  num_workers: 2

  log_every: 5
  save_every: 60
  eval_every: 100000   # effectively off (no val_index anyway)

wandb:
  enabled: false
