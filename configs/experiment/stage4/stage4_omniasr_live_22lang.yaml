# Stage 4 (live omniASR, v1 scope): encoder unfrozen (continues from Stage 1's
# checkpoint), LLM base frozen with LoRA still active (continues Stage 3's
# adapters via --resume_from). Not yet runnable — chains off Stage 2/3
# outputs that don't exist yet. Must run under .envs/omniasr_extract, not
# Aura_base/env. See docs/stage1_omniasr_ctc_guide.md for reasoning.

encoder:
  type: omniasr_live
  checkpoint: /ocean/projects/cis250145p/tanghang/iwslt2026/runs/stage1_omniasr_ctc_22lang_h100_weighted/encoder_step20000.pt
  dropout_p: 0.1
  attn_dropout_p: 0.1
  ffn_inner_dropout_p: 0.1
  layer_drop_p: 0.0
  final_dropout_p: 0.1
  freeze_ctc_head: true   # ctc_head gets no gradient (ctc_weight=0.0); rest of encoder trains

aura:
  checkpoint: /ocean/projects/cis250145p/shared/checkpoints/Aura-1B/model.pt
  tokenizer:  /ocean/projects/cis250145p/shared/checkpoints/Aura-1B/tokenizer.json
  size: 1b

projector:
  type: transformer
  num_layers: 2
  num_heads: 8
  dropout: 0.1

ctc_compress:
  enabled: true
  strategy: avg        # only strategy that needs no gradient through ctc_logits
  remove_blanks: true
  blank_id: 0

data:
  train_index: /ocean/projects/cis250145p/shared/ASR_INDEX_V4_16k.csv
  val_index:   /ocean/projects/cis250145p/shared/ASR_INDEX_V4_16k.csv
  train_split: train
  val_split:   dev
  languages:   null   # null = all 22 languages in the index
  max_duration: 20.0
  lowercase: true

training:
  task: transcribe
  output_dir: runs/stage4_omniasr_live_22lang
  # Launch with: --resume_from runs/stage3_omniasr_live_22lang/checkpoint_stepNNNN
  # (loads projector + LoRA; encoder starts fresh from encoder.checkpoint above)
  val_samples_per_lang: 30

  unfreeze_encoder: true   # Stage 4's defining change vs Stage 3
  unfreeze_llm: false      # LLM base still frozen; LoRA continues adapting it
  lora_rank: 32
  lora_alpha: 64
  lora_targets: [q_proj, v_proj]

  ctc_weight: 0.0           # required by build_model()'s omniasr_live guard

  max_steps: 5000
  lr: 1.0e-5   # low — a 975M-param pretrained encoder is easy to destroy
  min_lr: 1.0e-7
  warmup_steps: 250
  first_cycle_steps: 5000
  gamma: 0.5
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 16

  max_batch_duration: 40.0
  max_batch_size: 4
  max_seq_len: 1024
  num_workers: 4

  log_every: 20
  save_every: 1000   # encoder is trainable again here -> full checkpoints (~12GB each)
  eval_every: 500

  no_wandb: false
  wandb_project: aura-mt
  wandb_entity: etanghan-carnegie-mellon-university
  wandb_run_name: stage4_omniasr_live_22lang
