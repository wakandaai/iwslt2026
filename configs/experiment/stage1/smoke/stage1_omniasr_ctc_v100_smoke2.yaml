# Smoke test for stage1_omniasr_ctc_22lang_v100.yaml's batch settings at the
# real grad_accum=32 (a smaller grad_accum can mask OOM churn — see
# docs/stage1_omniasr_ctc_guide.md).

encoder:
  type: omniasr_live
  checkpoint: /ocean/projects/cis250145p/tanghang/iwslt2026/checkpoints/omniasr_ctc_1b/omniASR-CTC-1B.pt
  dropout_p: 0.1
  attn_dropout_p: 0.1
  ffn_inner_dropout_p: 0.1
  layer_drop_p: 0.0
  final_dropout_p: 0.1
  freeze_ctc_head: false

data:
  train_index:      /ocean/projects/cis250145p/shared/ASR_INDEX_V4_16k.csv
  val_index:        /ocean/projects/cis250145p/shared/ASR_INDEX_V4_16k.csv
  train_split:       train
  val_split:         dev
  sp_tokenizer_path: /ocean/projects/cis250145p/tanghang/iwslt2026/checkpoints/omniasr_ctc_1b/omniASR_tokenizer.model
  languages:          null
  max_duration:       20.0
  min_duration:       0.5
  max_target_tokens:  400
  lowercase:          true

training:
  output_dir: runs/stage1_omniasr_ctc_v100_smoke2

  max_steps: 10
  lr: 1.0e-5
  min_lr: 1.0e-7
  warmup_steps: 3
  first_cycle_steps: 10
  gamma: 0.5
  scheduler: cosine_warmup_restarts
  weight_decay: 0.01
  grad_accum: 32

  max_batch_duration: 10.0
  max_batch_size: 2
  num_workers: 4

  log_every: 1
  save_every: 5
  eval_every: 5
  val_samples_per_lang: 3
  val_batch_size: 2

  no_wandb: true
